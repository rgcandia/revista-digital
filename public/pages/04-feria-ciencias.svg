<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842">
  <rect width="595" height="842" fill="#fafafa"/>
  <text x="50" y="55" font-family="sans-serif" font-size="10" fill="#032960" font-weight="600" letter-spacing="2">PRIMARIA</text>
  <text x="50" y="100" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#1a1a2e">Feria de ciencias</text>
  <text x="50" y="140" font-family="Georgia,serif" font-size="20" fill="#555">Proyectos que inspiran</text>
  <line x1="50" y1="160" x2="300" y2="160" stroke="#032960" stroke-width="3"/>

  <text x="50" y="200" font-family="Georgia,serif" font-size="14" line-height="1.8" fill="#333">
    <tspan x="50" dy="0">La Feria de Ciencias 2026 fue todo un éxito. Durante</tspan>
    <tspan x="50" dy="22">tres días, los alumnos de nivel Primario presentaron</tspan>
    <tspan x="50" dy="22">sus proyectos ante la comunidad educativa.</tspan>
    <tspan x="50" dy="22">Desde experimentos de química hasta investigaciones</tspan>
    <tspan x="50" dy="22">sobre el cuidado del medio ambiente, la creatividad</tspan>
    <tspan x="50" dy="22">y el entusiasmo fueron los protagonistas.</tspan>

    <tspan x="50" dy="40" font-weight="700" fill="#032960">Proyectos destacados</tspan>
    <tspan x="50" dy="22" font-weight="700">🌱 Huerta orgánica escolar</tspan>
    <tspan x="50" dy="20" font-weight="400">Los alumnos de 4to grado presentaron su proyecto de</tspan>
    <tspan x="50" dy="20">huerta orgánica, explicando el proceso de cultivo y la</tspan>
    <tspan x="50" dy="20">importancia de una alimentación saludable.</tspan>

    <tspan x="50" dy="28" font-weight="700">🔬 Laboratorio de química</tspan>
    <tspan x="50" dy="20" font-weight="400">5to grado sorprendió con experimentos de química</tspan>
    <tspan x="50" dy="20">básica, incluyendo la creación de slime educativo y</tspan>
    <tspan x="50" dy="20">reacciones con cambios de color.</tspan>

    <tspan x="50" dy="28" font-weight="700">♻️ Reciclaje creativo</tspan>
    <tspan x="50" dy="20" font-weight="400">6to grado investigó sobre el impacto de los residuos</tspan>
    <tspan x="50" dy="20">y presentó soluciones creativas para el reciclaje en</tspan>
    <tspan x="50" dy="20">el hogar y la escuela.</tspan>
  </text>

  <text x="50" y="780" font-family="sans-serif" font-size="9" fill="#ccc">REVISTA NORBRIDGE · JULIO 2026 · PÁGINA 7</text>
</svg>
