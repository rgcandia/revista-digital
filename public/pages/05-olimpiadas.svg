<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842">
  <rect width="595" height="842" fill="#fafafa"/>
  <text x="50" y="55" font-family="sans-serif" font-size="10" fill="#032960" font-weight="600" letter-spacing="2">PRIMARIA</text>
  <text x="50" y="100" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#1a1a2e">Olimpiadas de</text>
  <text x="50" y="140" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#1a1a2e">matemática</text>
  <line x1="50" y1="160" x2="300" y2="160" stroke="#032960" stroke-width="3"/>

  <text x="50" y="200" font-family="Georgia,serif" font-size="14" fill="#333">
    <tspan x="50" dy="0">Un grupo de alumnos de 5to y 6to grado representó</tspan>
    <tspan x="50" dy="22">al colegio en las Olimpiadas de Matemática de la</tspan>
    <tspan x="50" dy="22">región, obteniendo excelentes resultados.</tspan>
    <tspan x="50" dy="22">La competencia, que reunió a más de 200 estudiantes</tspan>
    <tspan x="50" dy="22">de distintos colegios, se desarrolló en dos instancias:</tspan>
    <tspan x="50" dy="22">una escrita y otra de resolución de problemas en equipo.</tspan>

    <tspan x="50" dy="40" font-weight="700" fill="#032960">Resultados</tspan>
    <tspan x="50" dy="22" font-weight="400">🥇 1er puesto - Sofía Martínez (6to grado)</tspan>
    <tspan x="50" dy="22">🥈 2do puesto - Juan Pérez (5to grado)</tspan>
    <tspan x="50" dy="22">🥉 3er puesto - Equipo de 6to grado</tspan>

    <tspan x="50" dy="40" font-weight="700" fill="#032960">Felicitaciones a todos</tspan>
    <tspan x="50" dy="22" font-weight="400">"Estamos muy orgullosos de nuestros alumnos. Su</tspan>
    <tspan x="50" dy="22">dedicación y esfuerzo son un ejemplo para toda la</tspan>
    <tspan x="50" dy="22">comunidad", expresó la directora del nivel.</tspan>
  </text>

  <rect x="380" y="580" width="165" height="180" rx="10" fill="#e8eef8"/>
  <text x="462" y="650" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#032960">🏆</text>
  <text x="462" y="690" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#032960">1er Puesto</text>
  <text x="462" y="715" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555">Olimpiadas Regionales</text>
  <text x="462" y="740" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555">Matemática 2026</text>

  <text x="50" y="800" font-family="sans-serif" font-size="9" fill="#ccc">REVISTA NORBRIDGE · JULIO 2026 · PÁGINA 11</text>
</svg>
