<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842">
  <rect width="595" height="842" fill="#fafafa"/>
  <text x="50" y="55" font-family="sans-serif" font-size="10" fill="#032960" font-weight="600" letter-spacing="2">INICIAL</text>
  <text x="50" y="100" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#1a1a2e">Acto de cierre</text>
  <text x="50" y="140" font-family="Georgia,serif" font-size="20" fill="#555">del ciclo lectivo</text>
  <line x1="50" y1="160" x2="300" y2="160" stroke="#032960" stroke-width="3"/>

  <text x="50" y="200" font-family="Georgia,serif" font-size="14" line-height="1.8" fill="#333">
    <tspan x="50" dy="0">El pasado viernes 15 de diciembre, los alumnos de nivel</tspan>
    <tspan x="50" dy="22">Inicial celebraron el acto de cierre del ciclo lectivo 2026.</tspan>
    <tspan x="50" dy="22">Las salas de 3, 4 y 5 años presentaron canciones y</tspan>
    <tspan x="50" dy="22">coreografías preparadas junto a sus docentes.</tspan>
    <tspan x="50" dy="22">Fue una jornada emotiva donde las familias pudieron</tspan>
    <tspan x="50" dy="22">compartir los logros de todo el año.</tspan>

    <tspan x="50" dy="40" font-weight="700" fill="#032960">Un cierre con mucha emoción</tspan>
    <tspan x="50" dy="22" font-weight="400">Cada sala preparó una presentación especial. Los más</tspan>
    <tspan x="50" dy="22">chiquitos sorprendieron con su soltura en el escenario,</tspan>
    <tspan x="50" dy="22">mientras que las salas de 5 años demostraron todo lo</tspan>
    <tspan x="50" dy="22">aprendido en su paso por el nivel inicial.</tspan>

    <tspan x="50" dy="40" font-weight="700" fill="#032960">Palabras de la directora</tspan>
    <tspan x="50" dy="22" font-weight="400">La directora del nivel dirigió unas palabras a las familias,</tspan>
    <tspan x="50" dy="22">destacando el compromiso y la alegría de los niños durante</tspan>
    <tspan x="50" dy="22">todo el año. "Verlos crecer y aprender es nuestra mayor</tspan>
    <tspan x="50" dy="22">satisfacción", expresó emocionada.</tspan>
  </text>

  <text x="50" y="780" font-family="sans-serif" font-size="9" fill="#ccc">REVISTA NORBRIDGE · JULIO 2026 · PÁGINA 3</text>

  <rect x="430" y="650" width="115" height="115" rx="8" fill="#e8eef8"/>
  <text x="487" y="710" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#032960">🎭</text>
  <text x="487" y="740" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#032960">Acto de cierre</text>
</svg>
