  <text x="50" y="315" font-family="sans-serif" font-size="12" fill="#666">Proyectos innovadores de nuestros alumnos de primaria.</text>
  <text x="545" y="290" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="600" fill="#032960">7</text>

